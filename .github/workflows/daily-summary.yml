name: Daily Horizon Summary

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes
      models: read      # GitHub Models free API

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Diagnose AI API access (OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          CODE=$(curl -s -o /tmp/ai_test.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-20b:free","messages":[{"role":"user","content":"Reply with JSON only: {\"ok\": true}"}],"response_format":{"type":"json_object"},"max_tokens":50}' \
            https://openrouter.ai/api/v1/chat/completions)
          echo "🔍 OpenRouter API diagnostic: HTTP $CODE"
          head -c 300 /tmp/ai_test.json
          echo ""

      - name: Run Horizon
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Health check - daily summary must not be empty
        run: |
          set -e
          for f in docs/_posts/*-summary-*.md; do
            [ -f "$f" ] || continue
            if grep -qE "没有达到重要性阈值的条目|none met the importance threshold" "$f"; then
              echo "::error::Empty daily summary detected ($f) - AI scoring is failing. Review the diagnostic step output."
              exit 1
            fi
          done
          echo "✅ Health check passed: summaries contain real items"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
